spring.application.name=keynote-service
server.port=8085
spring.config.import=optional:configserver:http://localhost:9999

# Keycloak Configuration
keycloak.realm=conference-realm
keycloak.auth-server-url=http://localhost:8080/auth
keycloak.ssl-required=external
keycloak.resource=keynote-service
keycloak.credentials.secret=your-client-secret
keycloak.public-client=false
keycloak.use-resource-role-mappings=true

# Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/conference-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/conference-realm/protocol/openid-connect/certs
<div class="keynote-container">
  <div class="header">
    <h1>Gestion des Keynotes</h1>
    <button class="btn btn-primary" (click)="toggleForm()">
      {{ showForm ? 'Annuler' : '+ Ajouter une keynote' }}
    </button>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="error">
    {{ error }}
  </div>

  <!-- Formulaire -->
  <div class="form-card" *ngIf="showForm">
    <h2>{{ editingId ? 'Modifier' : 'Nouvelle' }} Keynote</h2>
    <form (ngSubmit)="saveKeynote()">
      <div class="form-group">
        <label for="nom">Nom *</label>
        <input
          type="text"
          id="nom"
          [(ngModel)]="newKeynote.nom"
          name="nom"
          class="form-control"
          placeholder="Nom de famille"
          required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom *</label>
        <input
          type="text"
          id="prenom"
          [(ngModel)]="newKeynote.prenom"
          name="prenom"
          class="form-control"
          placeholder="Prénom"
          required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="newKeynote.email"
          name="email"
          class="form-control"
          placeholder="Email">
      </div>

      <div class="form-group">
        <label for="fonction">Fonction</label>
        <input
          type="text"
          id="fonction"
          [(ngModel)]="newKeynote.fonction"
          name="fonction"
          class="form-control"
          placeholder="Fonction/Titre">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success">
          {{ editingId ? 'Mettre à jour' : 'Créer' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="toggleForm()">Annuler</button>
      </div>
    </form>
  </div>

  <!-- Liste des keynotes -->
  <div class="loading" *ngIf="loading">
    <p>Chargement...</p>
  </div>

  <div class="keynotes-list" *ngIf="!loading && keynotes.length > 0">
    <h2>Keynotes ({{ keynotes.length }})</h2>
    <div class="keynote-grid">
      <div class="keynote-card" *ngFor="let key of keynotes">
        <div class="card-header">
          <h3>{{ key.nom }} {{ key.prenom }}</h3>
        </div>
        <div class="card-body">
          <p><strong>Email:</strong> {{ key.email }}</p>
          <p *ngIf="key.fonction"><strong>Fonction:</strong> {{ key.fonction }}</p>
        </div>
        <div class="card-footer">
          <button class="btn btn-sm btn-warning" (click)="editKeynote(key)">
            Modifier
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteKeynote(key.id || '')">
            Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!loading && keynotes.length === 0">
    <p>Aucune keynote pour le moment. Créez-en une!</p>
  </div>
</div>
